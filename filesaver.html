<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus - File Saver</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/filesaver.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar-root"></aside>

      <main class="main">
        <div class="page-head">
          <h1 class="page-title">File Saver</h1>
          <p class="page-sub">
            Stored locally in this browser via IndexedDB — nothing leaves your
            machine.
          </p>
        </div>

        <div class="dropzone" id="dropzone">
          <svg class="dropzone-icon" viewBox="0 0 24 24">
            <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16" />
          </svg>
          <div class="dropzone-text">Drag files here, or click to browse</div>
          <div class="dropzone-sub">
            Any file type &middot; stored in this browser only
          </div>
          <input type="file" id="file-input" multiple />
        </div>

        <div class="storage-meter">
          <span id="storage-label">0 files</span>
          <div class="storage-track">
            <div class="storage-fill" id="storage-fill"></div>
          </div>
        </div>

        <div class="panel">
          <h3>Saved files</h3>
          <div id="file-list"></div>
        </div>
      </main>
    </div>

    <script src="dist/shared.js"></script>
    <script src="dist/nav.js"></script>
    <script src="dist/filesaver.js"></script>
  </body>
</html>
