<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus - Dashboard</title>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar-root"></aside>

      <main class="main">
        <div class="page-head">
          <h1 class="page-title" id="greet">Good evening, Udan</h1>
          <p class="page-sub" id="greet-sub">Loading&hellip;</p>
        </div>

        <div class="stats-row">
          <div class="panel stat-card">
            <div class="stat-label">Today's focus</div>
            <div class="stat-num accent" id="stat-pct">0%</div>
          </div>
          <div class="panel stat-card">
            <div class="stat-label">Tasks done</div>
            <div class="stat-num" id="stat-tasks">0/0</div>
          </div>
          <div class="panel stat-card">
            <div class="stat-label">Streak</div>
            <div class="stat-num" id="stat-streak">0 days</div>
          </div>
          <div class="panel stat-card">
            <div class="stat-label">Files saved</div>
            <div class="stat-num" id="stat-files">0</div>
          </div>
        </div>

        <div class="chart-row">
          <div class="panel glow donut-wrap">
            <h3>Completion</h3>
            <svg
              class="donut-svg"
              width="180"
              height="180"
              viewBox="0 0 180 180"
            >
              <defs>
                <linearGradient id="donutGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#00ffb2" />
                  <stop offset="100%" stop-color="#4dc9ff" />
                </linearGradient>
              </defs>
              <circle class="donut-track" cx="90" cy="90" r="70" />
              <circle
                id="donut-fill"
                class="donut-fill"
                cx="90"
                cy="90"
                r="70"
                stroke-dasharray="440"
                stroke-dashoffset="440"
                transform="rotate(-90 90 90)"
              />
              <text
                id="donut-center-text"
                class="donut-center"
                x="90"
                y="96"
                text-anchor="middle"
              >
                0%
              </text>
              <text class="donut-sub" x="90" y="114" text-anchor="middle">
                complete
              </text>
            </svg>
            <p class="donut-legend">Live — updates as you check off tasks</p>
          </div>

          <div class="panel">
            <h3>7-day completion history</h3>
            <div class="bar-chart" id="bar-chart"></div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
